name: Show FileTree
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pages: write

jobs:
  generate-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 获取文件树（处理递归目录）
      - name: Fetch file structure
        id: get-files
        uses: actions/github-script@v6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fetchFiles = async (path) => {
              const { data } = await github.rest.repos.getContent({
                owner: 'BBBBBBlack',
                repo: 'Black2-Notes',
                path: path,
                ref: 'main'
              });

              const results = [];
              for (const item of data) {
                if (item.type === 'dir') {
                  const subItems = await fetchFiles(item.path);
                  results.push(...subItems);
                } else {
                  results.push({
                    name: item.name,
                    path: item.path,
                    type: item.type,
                    url: item.html_url
                  });
                }
              }
              return results;
            };

            // 要展示的顶层目录（与仓库中的目录名严格一致，区分大小写）
            const topDirs = ['paper notes', 'Operate System', 'transformer'];

            const allData = {};
            for (const dir of topDirs) {
              try {
                allData[dir] = await fetchFiles(dir);
              } catch (e) {
                console.log(`目录 ${dir} 抓取失败，已跳过: ${e.message}`);
                allData[dir] = [];
              }
            }
            return JSON.stringify(allData);  // 转为JSON字符串传递

      # 生成带完整路径的HTML
      - name: Generate HTML
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html>
          <head>
            <title>BBBBBBlack's Website</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
              .dir { color: #0366d6; cursor: pointer; font-weight: bold; margin: 5px 0; }
              .file { color: #24292e; margin: 3px 0; display: block; }
              .dir::before { content: "📂 "; }
              .file::before { content: "📄 "; }
              ul { list-style: none; padding-left: 15px; border-left: 1px dashed #ddd; }
              .hidden { display: none; }
              a { text-decoration: none; color: inherit; }
              a:hover { text-decoration: underline; }
              section { margin-bottom: 30px; }
            </style>
          </head>
          <body>
            <h1>📒 BBBBBBlack's Notes</h1>
            <div id="sections"></div>

            <script>
              const rawData = decodeURIComponent(${{ steps.get-files.outputs.result }}.replace(/[\\]/g, ''));
              const data = JSON.parse(rawData);  // { "paper notes": [...], "Operate System": [...], "transformer": [...] }

              // 每个目录的展示标题（不在表里的目录直接用原名）
              const titles = {
                'paper notes': '📚 Paper Notes',
                'Operate System': '💻 Operating System',
                'transformer': '🤖 Transformer'
              };

              // 构建层级结构
              function buildTree(items) {
                const tree = {};
                items.forEach(item => {

                  // 跳过assets和attachments目录
                  if (item.path.includes('assets/') || item.path.includes('attachments/')) {
                    return;
                  }

                  // 去掉第一段（顶层目录名），适用于所有目录
                  const pathParts = item.path.split('/').slice(1);
                  let currentLevel = tree;

                  pathParts.slice(0, -1).forEach(part => {
                    if (!currentLevel[part]) {
                      currentLevel[part] = {};
                    }
                    currentLevel = currentLevel[part];
                  });

                  currentLevel[pathParts[pathParts.length - 1]] = item;
                });
                return tree;
              }


              // 渲染HTML
              function renderTree(node, level = 0) {
                let html = '<ul' + (level === 0 ? '' : ' class="hidden"') + '>';
                Object.keys(node).forEach(key => {
                  const item = node[key];
                  if (item.url) {
                    html += `<li class="file"><a href="${item.url}" target="_blank">${key}</a></li>`;
                  } else {
                    html += `<li class="dir"><span onclick="toggleDir(this)">${key}</span>`;
                    html += renderTree(item, level + 1);
                    html += `</li>`;
                  }
                });
                return html + '</ul>';
              }

              function toggleDir(span) {
                const li = span.parentElement;
                const ul = li.querySelector('ul');
                if (ul) ul.classList.toggle('hidden');
              }


              // 每个顶层目录渲染成一个独立区块
              const container = document.getElementById('sections');
              Object.keys(data).forEach(dir => {
                const files = data[dir];
                if (!files || files.length === 0) return;  // 空目录/抓取失败的不显示
                const section = document.createElement('section');
                section.innerHTML = `<h2>${titles[dir] || dir}</h2><div class="tree"></div>`;
                container.appendChild(section);
                section.querySelector('.tree').innerHTML = renderTree(buildTree(files));
              });

              // 默认展开第一级
              // document.querySelectorAll('#sections .tree > ul > li.dir').forEach(el => {
              //   el.querySelector('ul').classList.remove('hidden');
              // });
            </script>
          </body>
          </html>
          EOF

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
